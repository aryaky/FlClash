display_name: FlClashTest
package_name: FlClashTest
maintainer:
  name: chen08209
  email: chen08209@gmail.com

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libsecret-1-0

# The Helper unit is written on demand by the app, not at install time, so only
# its teardown belongs here; the binary is already gone when postrm runs.
postuninstall_scripts:
  - 'case "${1:-}" in remove|purge) ;; *) exit 0 ;; esac'
  - 'systemctl disable --now flclashtest-helper.service >/dev/null 2>&1 || true'
  - 'rm -f /etc/systemd/system/flclashtest-helper.service'
  - 'systemctl daemon-reload >/dev/null 2>&1 || true'

supported_mime_type:
  - x-scheme-handler/clashtest
  - x-scheme-handler/clashmetatest
  - x-scheme-handler/flclashtest

keywords:
  - FlClashTest
  - Clash
  - ClashMeta
  - Proxy

generic_name: FlClashTest

categories:
  - Network

startup_notify: true
